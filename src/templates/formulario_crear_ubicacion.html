{% extends 'layout.html' %}
{% block contenido %}
    <img src="{{ url_for('static', filename='images/Leon.pg') }}" class="rounded mx-auto d-block" alt="...">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form action="crear_ubicacion" method="post">
                    <div class="form-group col-md-6" style="margin-bottom: 30px;">
                        <label for="ubicacion">Ubicación</label>
                        <input type="text" class="form-control" id="ubicacion" name="ubicacion" placeholder="Ubicación" pattern="[A-Z\s]+" title="Solo se permiten letras mayúsculas y espacios">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="piso">Piso</label>
                            <input type="text" class="form-control" id="piso" name="piso" placeholder="Piso" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="puesto">Puesto</label>
                            <input type="text" class="form-control" id="puesto" name="puesto" placeholder="Puesto" required>
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-dark">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <img src="{{ url_for('static', filename='images/rs.pg') }}" class="img-responsive mx-auto d-block align-middle" alt="...">

    <script>
        document.getElementById('ubicacion').addEventListener('input', function (e) {
            e.target.value = e.target.value.toUpperCase();
        });
    </script>
{% endblock contenido %}
