{% extends 'layout.html' %}
{% block contenido %}
    <img src="{{ url_for('static', filename='images/Leon.pg') }}" class="rounded mx-auto d-block" alt="...">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form>
                    <div class="form-group col-md-6" style="margin-bottom: 30px;">
                        <label for="tipo">Tipo</label>
                        <input type="text" class="form-control" id="tipo" placeholder="Tipo" pattern="[A-Z\s]+" title="Solo se permiten letras mayúsculas y espacios">
                    </div>
                    <div class="form-group col-md-6" style="margin-bottom: 30px;">
                        <label for="categoria">Categoría</label>
                        <select class="form-control" id="categoria" name="categoria">
                            {% for categoria in categorias %}
                                <option value="{{ categoria.idTipo }}">{{ categoria.categoria }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="text-center">
                        <button type="guardar" class="btn btn-dark">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <img src="{{ url_for('static', filename='images/rs.pg') }}" class="img-responsive mx-auto d-block align-middle" alt="...">

    <script>
        // Script para convertir el texto a mayúsculas mientras el usuario escribe
        document.getElementById('tipo').addEventListener('input', function (e) {
            e.target.value = e.target.value.toUpperCase();
        });
    </script>
{% endblock contenido %}
