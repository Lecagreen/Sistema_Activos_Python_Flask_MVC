{% extends 'layout.html' %}

{% block contenido %}
    <img src="{{ url_for('static', filename='images/Leon.pg') }}" class="rounded mx-auto d-block" alt="...">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form action="crear_tipo" method="post">
                    <div class="form-group col-md-6" style="margin-bottom: 30px;">
                        <label for="tipo">Tipo</label>
                        <input type="text" class="form-control" id="tipo" name="tipo" pattern="[A-Z\s]+" title="Solo se permiten letras mayúsculas y espacios">
                    </div>
                    <div class="form-group col-md-6" style="margin-bottom: 30px;">
                        <label for="categoria">Categoría Activo</label>
                        <select id="categoria" name="categoria" class="form-control">
                            <option selected>Seleccione...</option>
                            {% for categoria in categorias %}
                                <option value={{categoria.idCategoria}}>{{categoria.categoria}}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-dark">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <img src="{{ url_for('static', filename='images/rs.pg') }}" class="img-responsive mx-auto d-block align-middle" alt="...">

    <script>
        document.getElementById('tipo').addEventListener('input', function (e) {
            e.target.value = e.target.value.toUpperCase();
        });
    </script>

{% endblock contenido %}
