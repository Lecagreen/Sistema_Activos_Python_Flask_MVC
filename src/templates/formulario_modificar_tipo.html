{% extends 'layout.html' %}
{% block contenido %}
    <img src="{{ url_for('static', filename='images/Leon.pg') }}" class="rounded mx-auto d-block" alt="...">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form>
                    <div class="form-group col-md-6" style="margin-bottom: 20px;">
                        <label for="tipo">Tipo</label>
                        <select class="form-control" id="categoria">
                            <option value="TIPO1">TIPO1</option>
                            <option value="TIPO2">TIPO2</option>
                            <option value="TIPO3">TIPO3</option>
                        </select>
                    </div>
                    <div class="form-group col-md-6" style="margin-bottom: 30px;">
                        <label for="categoria">Categoría</label>
                        <input type="text" class="form-control" id="categoria" name="categoria" disabled>
                    </div>
                    <div class="text-center">
                        <button type="guardar" class="btn btn-dark">Modificar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <img src="{{ url_for('static', filename='images/rs.pg') }}" class="img-responsive mx-auto d-block align-middle" alt="...">

{% endblock contenido %}
