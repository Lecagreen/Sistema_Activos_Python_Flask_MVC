{% extends 'layout.html' %}
{% block contenido %}
    <img src="{{ url_for('static', filename='images/Leon.pg') }}" class="rounded mx-auto d-block" alt="...">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="eliminar-modelo-form" action="{{ url_for('eliminar_modelo', idModelo=modelo_actual.idModelo) }}" method="post">
                    <div class="form-group col-md-6" style="margin-bottom: 20px;">
                        <label for="modelo">Modelo</label>
                        <input type="text" class="form-control" id="nuevo_modelo" value="{{ modelo_actual.modelo }}" readonly>
                    </div>
                    <div class="form-group col-md-6" style="margin-bottom: 30px;">
                        <label for="marca">Marca Activo</label>
                        <input type="text" class="form-control" id="marca" value="{% for marca in marcas %}{% if marca.idMarca == modelo_actual.marca %}{{ marca.marca }}{% endif %}{% endfor %}" readonly>
                    </div>
                    <div class="d-flex flex-column align-items-center">
                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn btn-danger mx-2">Eliminar Modelo No Vigente</button>
                            <button type="button" id="cancelar-btn" class="btn btn-secondary mx-2">Cancelar</button>
                        </div>
                    </div>
                </form>
                <script>
                    document.getElementById('cancelar-btn').addEventListener('click', function () {
                        window.location.href = "{{ url_for('ver_modelos') }}";
                    });
                </script>
{% endblock contenido %}
