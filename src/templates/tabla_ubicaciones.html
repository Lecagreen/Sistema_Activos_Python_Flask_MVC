{% extends 'layout.html' %}
{% block contenido %}

    </div>
      <a href="/crear_ubicacion" class="btn btn-primary mt-3 mb-4">
        <i class="fa-solid fa-file-circle-plus"></i> Crear Ubicación
      </a>
      </nav>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Ubicación</th>
            <th scope="col">Piso</th>
            <th scope="col">Puesto</th>
            <th scope="col">Vigente</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          {% for ubicacion in ubicaciones %}
            <tr>  
              <th scope="row">{{ubicacion.idUbicacion}}</th>
              <td>{{ubicacion.ubicacion}}</td>
              <td>{{ubicacion.piso}}</td>
              <td>{{ubicacion.puesto}}</td>
              <td>{{ubicacion.estado}}</td>
              <td>
                <a class="btn btn-success" href="editar_ubicacion/{{ubicacion.idUbicacion}}">
                  <i class="fas fa-edit"></i>
                </a>
                <a class="btn btn-danger" href="eliminar_ubicacion/{{ubicacion.idUbicacion}}">
                  <i class="fas fa-trash-alt"></i> 
                </a>
              </td> 
            </tr>
          {% endfor %}
        </tbody>
      </table>
  </body>
  </html>

{% endblock contenido %}
