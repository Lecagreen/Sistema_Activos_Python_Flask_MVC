{% extends 'layout.html' %}
{% block contenido %}
    <img src="{{ url_for('static', filename='images/Leon.pg') }}" class="rounded mx-auto d-block" alt="...">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="eliminar-tipo-form" action="{{ url_for('eliminar_tipo', idTipo=tipo_actual.idTipo) }}" method="post">
                    <div class="form-group col-md-6" style="margin-bottom: 20px;">
                        <label for="tipo">Tipo</label>
                        <input type="text" class="form-control" id="nuevo_tipo" value="{{ tipo_actual.tipo }}" readonly>
                    </div>
                    <div class="form-group col-md-6" style="margin-bottom: 30px;">
                        <label for="categoria">Categoría Activo</label>
                        <input type="text" class="form-control" id="categoria" value="{% for categoria in categorias %}{% if categoria.idCategoria == tipo_actual.categoria %}{{ categoria.categoria }}{% endif %}{% endfor %}" readonly>
                    </div>
                    <div class="d-flex flex-column align-items-center">
                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn btn-danger mx-2">Eliminar Categoría No Vigente</button>
                            <button type="button" id="cancelar-btn" class="btn btn-secondary mx-2">Cancelar</button>
                        </div>
                    </div>
                </form>
                <script>
                    document.getElementById('cancelar-btn').addEventListener('click', function () {
                        window.location.href = "{{ url_for('ver_tipos') }}";
                    });
                </script>
{% endblock contenido %}
