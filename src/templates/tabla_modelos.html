{% extends 'layout.html' %}
{% block contenido %}

    </div>

      <a href="/crear_modelo" class="btn btn-primary mt-3 mb-4">
        <i class="fa-solid fa-file-circle-plus"></i> Crear Modelo
      </a>

      </nav>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Modelo</th>
            <th scope="col">Marca</th>
            <th scope="col">Vigente</th>
            <th scope="col">Accciones</th>
          </tr>
        </thead>
        <tbody>
          {% for modelo in modelos %}
            <tr>  
              <th scope="row">{{modelo.Modelos.idModelo}}</th>
              <td>{{modelo.Modelos.modelo}}</td>
              <td>{{modelo.Marcas.marca}}</td>
              <td>{{modelo.Marcas.estado}}</td>
              <td>
                <a class="btn btn-danger" href="eliminar_modelo/{{modelo.Modelos.idModelo}}">
                  <i class="fas fa-edit"></i>
                </a>
                <a class="btn btn-success" href="editar_modelo/{{modelo.Modelos.idModelo}}">
                  <i class="fas fa-trash-alt"></i>                   
                </a>
              </td> 
            </tr>
          {% endfor %}
        </tbody>
      </table>
  </body>
  </html>

{% endblock contenido %}
