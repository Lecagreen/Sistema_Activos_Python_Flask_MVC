{% extends 'layout.html' %}
{% block contenido %}
    <img src="{{ url_for('static', filename='images/Leon.pg') }}" class="rounded mx-auto d-block" alt="...">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form action="crear_marca" method="post">
                    <div class="form-group col-md-6" style="margin-bottom: 30px;">
                        <label for="marca">Marca</label>
                        <input type="text" class="form-control" id="marca" name="marca" placeholder="Marca" pattern="[A-Z\s]+" title="Solo se permiten letras mayúsculas y espacios">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-dark">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <img src="{{ url_for('static', filename='images/rs.pg') }}" class="img-responsive mx-auto d-block align-middle" alt="...">

    <script>
        document.getElementById('marca').addEventListener('input', function (e) {
            e.target.value = e.target.value.toUpperCase();
        });
    </script>
{% endblock contenido %}
