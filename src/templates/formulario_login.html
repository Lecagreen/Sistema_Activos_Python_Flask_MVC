{% extends 'layout.html' %}
{% block contenido %}
    <img src="{{ url_for('static', filename='images/Leon.pg') }}" class="rounded mx-auto d-block" alt="...">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form action="login" method="post">
                    <div class="form-group">
                      <label for="usuario">Usuario</label>
                      <input type="usuario" class="form-control" id="usuario" name="usuario" placeholder="Digite su usuario">
                    </div>
                    <div class="form-group">
                      <label for="contrasena">Contraseña</label>
                      <input type="password" class="form-control" name="contrasena" id="contrasena" placeholder="Contraseña">
                    </div>
                    <div class="form-group form-check">
                      <input type="checkbox" class="form-check-input" id="exampleCheck1">
                      <label class="form-check-label" for="exampleCheck1">Check me out</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                  </form>
            </div>
        </div>
    </div>
    <img src="{{ url_for('static', filename='images/rs.pg') }}" class="img-responsive mx-auto d-block align-middle" alt="...">
    
    {% endblock contenido %}
